[project]
name = "arctic-ant-coverage"
version = "0.1.0"
description = "Interactive map of 1500 km coverage circles on a 5-degree lat/lon grid over the Canadian Arctic"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
    "matplotlib>=3.9",
    "cartopy>=0.24",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctic_ant_coverage"]

[project.scripts]
arctic-ant-coverage = "arctic_ant_coverage.main:main"
